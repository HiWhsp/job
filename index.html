<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP会员充值</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 用户信息头部 -->
        <div class="user-header">
            <div class="user-info">
                <img src="https://via.placeholder.com/50x50/f0a500/ffffff?text=头像" alt="用户头像" class="avatar">
                <div class="user-details">
                    <div class="phone-number">15810593012</div>
                    <div class="user-status">VIP会员　已经缴费明年有效期到期</div>
                </div>
            </div>
            <div class="upgrade-btn">立即升级</div>
        </div>

        <!-- VIP会员卡片 -->
        <div class="vip-card">
            <div class="vip-content">
                <div class="vip-title">VIP会员</div>
                <div class="vip-price">¥365.00</div>
                <div class="vip-validity">今后自有剩余1月</div>
            </div>
            <div class="vip-icon">
                <div class="diamond-icon">💎</div>
            </div>
        </div>

        <!-- 会员权益 -->
        <div class="benefits-section">
            <h3>会员权益</h3>
            <div class="benefits-text">
                会员权益详细描述文字介绍会员权益详细描述文字介绍会员权益详细描述文字介绍会员权益详细描述文字介绍会员权益详细描述文字介绍
            </div>
        </div>

        <!-- 支付方式 -->
        <div class="payment-section">
            <div class="payment-methods">
                <div class="payment-option active">
                    <div class="payment-icon wechat">💚</div>
                    <span>微信支付</span>
                </div>
                <div class="payment-option">
                    <div class="payment-icon alipay">💙</div>
                    <span>支付宝支付</span>
                </div>
            </div>
            <div class="qr-section">
                <div class="qr-code">
                    <div class="qr-placeholder">二维码</div>
                </div>
                <div class="qr-info">
                    <div class="price-info">1年入门版　自动续费*</div>
                    <div class="price">¥365</div>
                    <div class="price-note">支持明月大宗买卖　1个成功助理服务</div>
                </div>
            </div>
        </div>

        <!-- 订单信息 -->
        <div class="order-section">
            <h3>我的会员订单</h3>
            <table class="order-table">
                <thead>
                    <tr>
                        <th>会员服务</th>
                        <th>单价</th>
                        <th>数量</th>
                        <th>支付金额</th>
                        <th>订单状态</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>订单号：J645122542</td>
                        <td>下单时间：2024-05-03 09:45:54</td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>VIP会员</td>
                        <td>¥365.00</td>
                        <td>1</td>
                        <td>¥365.00</td>
                        <td class="status-completed">交易完成</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
